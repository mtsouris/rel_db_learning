# This file is used to configure your project.
# Read more about the various options under:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html

[metadata]
name = REL_DB_LEARNING
description = Interactive Algorithm Library Development via Jupyter Notebooks and pgModeler for Relational Database Learning
author = Manolis Tsouris
license = MIT
license_files = LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
url = https://github.com/mtsouris/rel_db_learning
project_urls =
    Source = https://github.com/mtsouris/rel_db_learning
    Tracker = https://github.com/mtsouris/rel_db_learning/issues

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Intended Audience :: Education
    Topic :: Education


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Require a min/specific Python version (comma-separated conditions)
python_requires = >=3.9

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
install_requires =
    importlib-metadata; python_version<"3.8"
    jupyter
    pandas
    numpy
    sqlalchemy
    psycopg2-binary
    ipywidgets
    matplotlib
    seaborn
    lxml
# Note: the functional-dependency engine for Module 05 is vendored under
# rel_db_learning/normalization/_vendor/ (a subset of the Apache-2.0 licensed
# dbis-functional-dependencies 1.0.4). It is not listed here because the
# upstream package declares heavy and broken runtime dependencies (sphinx,
# build, networkx, graphviz, numpy~=1.26) that its FD logic never imports.
# At runtime the vendored code needs only numpy (declared above) and stdlib.


[options.package_data]
rel_db_learning =
    data/chinook/*.sql
    data/my_project/*.sql
    normalization/_vendor/LICENSE
    normalization/_vendor/NOTICE

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install REL_DB_LEARNING[PDF]` like:
# PDF = ReportLab; RXP

ibis =
    ibis-framework[postgres]

# Add here test requirements (semicolon/line-separated)
testing =
    setuptools
    pytest
    pytest-cov

[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = rel_db_learning.module:function
# For example:
# console_scripts =
#     fibonacci = rel_db_learning.skeleton:run
# And any other entry points, for example:
# pyscaffold.cli =
#     awesome = pyscaffoldext.awesome.extension:AwesomeExtension

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov rel_db_learning --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.6
package = rel_db_learning
